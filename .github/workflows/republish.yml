# Republishes this site from claude-company's main, so solana.claudedotcompany.com can
# never fall behind the apex again.
#
# This repository is BUILT OUTPUT only (see README.md). Until 2026-09-13 it was
# regenerated by hand with scripts/publish-solana-site.sh on the owner's Mac, and it
# fell two days and eight releases behind the apex while the owner read a floor that
# "never updated". This workflow is that script, run by the repository itself: every
# half hour, and on demand, it checks out the source at main, builds it for this host
# with the desk's API base and the release commit stamped, stages it exactly as the
# script does, and commits the result to main only when something changed. GitHub
# Pages then publishes main as it always has.
name: Republish from claude-company

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [source-published]

permissions:
  contents: write

concurrency:
  group: republish
  cancel-in-progress: false

jobs:
  republish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: site
      - name: Check out the source (claude-company, main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gtjvv976mb-netizen/claude-company
          ref: main
          path: src
          persist-credentials: false
      - name: Skip when the site already carries this source commit
        id: fresh
        run: |
          SRC="$(git -C src rev-parse HEAD)"
          HAVE="$(node -e 'try{console.log(JSON.parse(require("fs").readFileSync("site/build.json","utf8")).commit||"")}catch{console.log("")}')"
          echo "source=$SRC" >> "$GITHUB_OUTPUT"
          if [ "$SRC" = "$HAVE" ]; then echo "up to date at $SRC"; echo "changed=false" >> "$GITHUB_OUTPUT";
          else echo "site at '${HAVE:-none}', source at $SRC"; echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.fresh.outputs.changed == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            src/package-lock.json
            src/executor/package-lock.json
      - name: Install the source's dependencies
        if: steps.fresh.outputs.changed == 'true'
        working-directory: src
        run: |
          npm ci
          npm ci --prefix executor --ignore-scripts
      - name: Build for this host
        if: steps.fresh.outputs.changed == 'true'
        working-directory: src
        # The same variables the apex workflow and publish-solana-site.sh pass. The API
        # base is the desk's public service; WC_PROJECT_ID is a public app id and is
        # read from this repository's Variables when set.
        env:
          SITE_URL: https://solana.claudedotcompany.com
          API_BASE: ${{ vars.API_BASE || 'https://claude-company-api.onrender.com' }}
          RH_API_BASE: ${{ vars.RH_API_BASE || 'https://claude-company-robinhood-api.onrender.com' }}
          EXECUTOR_COMMIT: ${{ steps.fresh.outputs.source }}
          WC_PROJECT_ID: ${{ vars.WC_PROJECT_ID }}
        run: npm run build
      - name: Stage the build as publish-solana-site.sh does
        if: steps.fresh.outputs.changed == 'true'
        run: |
          # Wipe only the published files, never .git, the README or this workflow.
          find site -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name README.md -exec rm -rf {} +
          cp -R src/dist/. site/
          cd site
          python3 - <<'PY'
          s = open("solana.html", encoding="utf-8").read()
          n = s.count('href="index.html"')
          # On the apex these meant "back to the gateway"; on this host index.html IS this
          # page, so they must be absolute or they become self-links.
          s = s.replace('href="index.html"', 'href="https://claudedotcompany.com/"')
          open("index.html", "w", encoding="utf-8").write(s)
          print(f"index.html <- solana.html ({n} gateway links repointed)")
          PY
          echo "solana.claudedotcompany.com" > CNAME
      - name: Commit and push when something changed
        if: steps.fresh.outputs.changed == 'true'
        working-directory: site
        run: |
          git add -A
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Republish the Solana tower from $(git -C ../src rev-parse --short HEAD)"
          git push origin HEAD:main
